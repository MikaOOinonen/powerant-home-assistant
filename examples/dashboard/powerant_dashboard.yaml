views:
  - title: "###NAME###"
    path: powerant-device
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # PowerAnt – ###NAME###
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  box-shadow: none !important;
                  background: transparent !important;
                  display: flex !important;
                  justify-content: center !important;                
                }
                ha-markdown {
                  padding: 8px 16px 4px 16px !important;
                  text-align: center !important;
                }
          - type: entities
            entities:
              - entity: input_boolean.show_tomorrow
                name: Show tomorrow
          - type: custom:apexcharts-card
            header:
              show: true
              title: Today - Calculated schedule
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: day
            apex_config:
              chart:
                height: 300
                stacked: true
              xaxis:
                type: datetime
              yaxis:
                decimalsInFloat: 2
                title:
                  text: c/kWh
              plotOptions:
                bar:
                  columnWidth: 80%
            series:
              - entity: sensor.###DEVICE###_savings_today
                name: Estimated savings
                type: line
                color: green
                float_precision: 1
                show:
                  in_chart: false
                  in_header: true
                  legend_value: false
              - entity: sensor.###DEVICE###_calculated_schedule
                name: Power ON
                type: column
                color: green
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  const schedule = entity.attributes.schedule || [];

                  return schedule.map((item) => {
                    const ts = item.timestamp;

                    const year = Number(ts.substring(0, 4));
                    const month = Number(ts.substring(4, 6)) - 1;
                    const day = Number(ts.substring(6, 8));
                    const hour = Number(ts.substring(8, 10));
                    const minute = ts.length >= 12
                      ? Number(ts.substring(10, 12))
                      : 0;

                    const time = new Date(
                      year,
                      month,
                      day,
                      hour,
                      minute
                    ).getTime();

                    return [
                      time,
                      item.is_on ? Number(item.effective) : 0
                    ];
                  });
              - entity: sensor.###DEVICE###_calculated_schedule
                name: Power OFF
                type: column
                color: lightgrey
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  const schedule = entity.attributes.schedule || [];

                  return schedule.map((item) => {
                    const ts = item.timestamp;

                    const year = Number(ts.substring(0, 4));
                    const month = Number(ts.substring(4, 6)) - 1;
                    const day = Number(ts.substring(6, 8));
                    const hour = Number(ts.substring(8, 10));
                    const minute = ts.length >= 12
                      ? Number(ts.substring(10, 12))
                      : 0;

                    const time = new Date(
                      year,
                      month,
                      day,
                      hour,
                      minute
                    ).getTime();

                    return [
                      time,
                      item.is_on ? 0 : Number(item.effective)
                    ];
                  });
              - entity: sensor.###DEVICE###_calculated_schedule
                name: Now
                type: column
                color: red
                show:
                  in_header: false
                  legend_value: false
                data_generator: >
                  const schedule = entity.attributes.schedule || []; const now =
                  Date.now();

                  const rows = schedule
                    .map((item) => {
                      const ts = item.timestamp;
                      const time = new Date(
                        Number(ts.substring(0, 4)),
                        Number(ts.substring(4, 6)) - 1,
                        Number(ts.substring(6, 8)),
                        Number(ts.substring(8, 10)),
                        ts.length >= 12 ? Number(ts.substring(10, 12)) : 0
                      ).getTime();
                      return { time, eff: Number(item.effective) };
                    })
                    .sort((a, b) => a.time - b.time);

                  const diffs = rows
                    .slice(1)
                    .map((r, i) => r.time - rows[i].time)
                    .filter((d) => d > 0);
                  const SLOT = diffs.length ? Math.min(...diffs) : 3600000;

                  // Total height of the "Now" stack = highest daily price
                  // + 15% margin (minimum 0.5)

                  const maxPrice = Math.max(0, ...rows.map((r) => r.eff)); const
                  H = maxPrice + Math.max(maxPrice * 0.15,
                  0.5);                 

                  return rows.map((r) => [
                    r.time,
                    now >= r.time && now < r.time + SLOT ? Math.max(H - r.eff, 0) : 0,
                  ]);
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.show_tomorrow
                state: "on"
            card:
              type: custom:apexcharts-card
              header:
                show: true
                title: Tomorrow - Calculated schedule
                show_states: true
                colorize_states: true
              graph_span: 24h
              span:
                start: day
                offset: +1d
              apex_config:
                chart:
                  height: 300
                  stacked: true
                xaxis:
                  type: datetime
                yaxis:
                  decimalsInFloat: 2
                  title:
                    text: c/kWh
                plotOptions:
                  bar:
                    columnWidth: 80%
              series:
                - entity: sensor.###DEVICE###_savings_tomorrow
                  name: Estimated savings
                  type: line
                  color: green
                  float_precision: 1
                  show:
                    in_chart: false
                    in_header: true
                    legend_value: false
                - entity: sensor.###DEVICE###_calculated_schedule
                  name: Power ON
                  type: column
                  color: green
                  show:
                    in_header: false
                    legend_value: false
                  data_generator: |
                    const schedule = entity.attributes.tomorrow_schedule || [];

                    return schedule.map((item) => {
                      const ts = item.timestamp;

                      const year = Number(ts.substring(0, 4));
                      const month = Number(ts.substring(4, 6)) - 1;
                      const day = Number(ts.substring(6, 8));
                      const hour = Number(ts.substring(8, 10));
                      const minute = ts.length >= 12
                        ? Number(ts.substring(10, 12))
                        : 0;

                      const time = new Date(
                        year,
                        month,
                        day,
                        hour,
                        minute
                      ).getTime();

                      return [
                        time,
                        item.is_on ? Number(item.effective) : 0
                      ];
                    });
                - entity: sensor.###DEVICE###_calculated_schedule
                  name: Power OFF
                  type: column
                  color: lightgrey
                  show:
                    in_header: false
                    legend_value: false
                  data_generator: |
                    const schedule = entity.attributes.tomorrow_schedule || [];

                    return schedule.map((item) => {
                      const ts = item.timestamp;

                      const year = Number(ts.substring(0, 4));
                      const month = Number(ts.substring(4, 6)) - 1;
                      const day = Number(ts.substring(6, 8));
                      const hour = Number(ts.substring(8, 10));
                      const minute = ts.length >= 12
                        ? Number(ts.substring(10, 12))
                        : 0;

                      const time = new Date(
                        year,
                        month,
                        day,
                        hour,
                        minute
                      ).getTime();

                      return [
                        time,
                        item.is_on ? 0 : Number(item.effective)
                      ];
                    });          
